hero:{headline:"Donde el talento argentino se forja con el mercado más grande del mundo.",sub:"We are forging a high-bandwidth connection between Latin America's most dynamic talent pool and Asia's most advanced technological infrastructure.",cities:"Beijing · Shanghai · Shenzhen",date:"Noviembre 2026",cta1:"Aplicar como startup",cta2:"Sumar tu organización"},
concept:{label:"Qué es Qilin Forge",pull:"Las verdaderas alianzas se funden, se estructuran y se forjan a partir de energía viva e intencionada.",p1:"En la mitología china, el Qilin no es un símbolo de suerte aleatoria; es una criatura que se manifiesta ante la llegada de sabias mentes que alterarán el curso de la historia. De esa premisa nace nuestra identidad. Le sumamos Forge (la fragua) porque entendemos que las oportunidades de mayor impacto se moldean con visión a largo plazo, confianza y presencia real.",p2:"Es por esto que cruzaremos el mapa con empresarios innovadores que trabajan con pasión para dar soluciones potentes a problemas significantes.",p3:"China es el sistema operativo del comercio global. Qilin Forge se propone actuar como el puente para que el talento argentino se integre directamente con el ecosistema de innovación chino. El objetivo es consolidar una bilateralidad real, una conexión profunda donde la visión de ambos mundos se cruce para enriquecerse mutuamente."},
tesis:{title:"La tesis",p1:"Argentina tiene 12 unicornios, más de 1.000 startups activas y USD 400M en venture capital solo en el primer trimestre de 2026. Nuestro ecosistema tech es uno de los más maduros de Latinoamérica.",closing:"El talento está. La tracción está. Lo que falta es mayores niveles de distribución.",p2:"Las relaciones entre Argentina y China se concentran históricamente en commodities agroindustriales. En tecnología, hay una gran oportunidad para generar algo innovador, ya que no existe un canal estructurado que lo haga posible.",sub:"Qilin Forge nace para ser ese canal."},
opp:{title:"Noviembre 2026 abre una ventana clave",p0:"China representa el 18% del PBI global. Es líder en inversión extranjera directa y opera en la vanguardia de inteligencia artificial, blockchain, robótica, biotecnología y demás industrias. Es, además, el mercado de adopción tecnológica más agresivo del planeta.",p:"La confluencia de APEC, la CIE y la China Hi-Tech Fair concentra en pocas semanas la mayor densidad de actores, capital y decisiones del ecosistema tecnológico chino.",closing:"Combinar el talento innovador argentino con la escala, la capacidad de manufactura y el capital del mercado chino."},
mission:{title:"15 a 23 días. Tres ciudades. Una misión.",intro:"En noviembre de 2026, cruzaremos el mapa con empresarios innovadores que trabajan con pasión para dar soluciones potentes a problemas significantes. Una delegación curada de startups y empresas tecnológicas argentinas viaja a China, combinando formación cultural, exposición en ferias internacionales y reuniones directas con los actores que están definiendo el futuro de la tecnología global.",closing:"No es un viaje de exploración. Es el inicio de una colaboración tecnológica bilateral.",cities:[{name:"Beijing",zh:"北京",desc:"Formación cultural y contexto político-institucional"},{name:"Shanghai",zh:"上海",desc:"Reuniones de negocio y networking estratégico"},{name:"Shenzhen",zh:"深圳",desc:"Exposición en ferias tech y conexión con manufactura"}]},
del:{title:"La delegación",intro:"La composición de la delegación se definirá mediante un proceso de curaduría estricto, diseñado para garantizar la credibilidad de la misión y maximizar las probabilidades de resultado.",criteria:[{t:"Validación comercial",d:"Producto activo en el mercado. Buscamos tracción real, no ideas en fase de desarrollo."},{t:"Verticales clave",d:"AI, Fintech, Agtech, Logistics, Hardware y Healthtech. Sectores con alta demanda y potencial de escalabilidad en el mercado chino."},{t:"Sinergia estratégica",d:"Alineación comprobable con la infraestructura y los canales de distribución del ecosistema chino."},{t:"Adaptación cultural",d:"Dominio fluido del inglés y capacidad de adaptación a dinámicas de negociación asiáticas."}],process:"Registro en plataforma → Entrevistas técnicas → Selección final",min:"Mínimo 5 startups seleccionadas"},
orgs:{title:"Quiénes impulsan esto",intro:"Tres organizaciones respaldan esta misión, cada una desde su lugar:",items:[{name:"Buidlers",role:"Convoca, cura y legitima el talento que viaja.",desc:"Más de cinco años de trayectoria nativa en el ecosistema tech, construyendo infraestructura y comunidad desde adentro. Su recorrido incluye colaboraciones con Ethereum Foundation, Consensys, Aptos y Scroll, un programa educativo en Solidity junto al Gobierno de la Ciudad de Buenos Aires, y la organización de la hackatón oficial de DevConnect Buenos Aires 2025."},{name:"Rootgraph",role:"Central operativa y articulación institucional.",desc:"Se dedica a generar oportunidades de negocio entre startups, fondos de inversión y aceleradoras."},{name:"Human Friendly",role:"Dirección estratégica, comunicación y diseño de experiencia.",desc:"Agencia creativa y tecnológica. Aporta la dirección estratégica, la comunicación y el diseño de experiencia de toda la misión."}]},
inst:{title:"Respaldo diplomático argentino en China",intro:"La delegación cuenta con acompañamiento diplomático argentino en China.",points:["Aval institucional que legitima la misión ante actores clave de ambos ecosistemas","Facilitación de introducciones para sentar a la delegación en la mesa correcta","Apoyo en el diseño de la agenda para maximizar el impacto diplomático y comercial de cada reunión"]},
beyond:{pre:"No estamos organizando un evento.",hl:"Estamos construyendo un puente.",sub:"Qilin Forge no termina cuando el avión aterriza en Buenos Aires. Seguimiento de acuerdos, soft-landing continuo para las startups que avanzan, y la construcción de una infraestructura de relación entre ambos ecosistemas que trascienda esta primera misión."},
join:{title:"Sé parte",p:"Qilin Forge es un canal concreto de diplomacia comercial tecnológica. Posiciona a Argentina como origen de innovación, genera actividad bilateral real y construye una relación entre los ecosistemas de emprendedores de ambos países.",closing:"No buscamos espectadores. Buscamos socios que quieran construir este puente con nosotros."},
cta:{s:{title:"Startups",body:"Si sos una startup con tracción y visión global, esta es tu vía de acceso al mercado más grande del mundo.",btn:"Aplicar ahora",dates:"Convocatoria: 2 sept - 2 oct 2026"},i:{title:"Instituciones",body:"Si sos una institución que entiende que la competitividad tecnológica de Argentina se define por su capacidad de conectar con los mercados que están en la frontera, tu respaldo potencia esta misión.",btn:"Sumar tu institución"},sp:{title:"Sponsors",body:"Si sos una empresa o marca que quiere asociarse a una iniciativa de alto impacto con visibilidad internacional real, hay lugar en la mesa.",btn:"Explorar sponsorship"}},
faq:{title:"Preguntas frecuentes",groups:[
{label:"Generales",items:[
{q:"¿Qué es Qilin Forge?",a:"Es una misión de innovación y diplomacia comercial tecnológica que lleva a una delegación curada de startups y empresas tecnológicas argentinas a China en noviembre de 2026. La misión atraviesa Beijing, Shanghai y Shenzhen, combinando formación cultural, exposición en ferias internacionales y reuniones directas con actores estratégicos del ecosistema tecnológico chino."},
{q:"¿Cuándo es el viaje?",a:"Noviembre de 2026, con una duración de entre 15 y 23 días."},
{q:"¿Quiénes organizan Qilin Forge?",a:"Tres organizaciones: Buidlers (convocatoria y curaduría de talento tech), Rootgraph (central operativa y articulación institucional) y Human Friendly (dirección estratégica y comunicación)."}
]},
{label:"Para startups y empresas",items:[
{q:"¿Cómo puedo aplicar para ser parte de la delegación?",a:"La convocatoria abre el 2 de septiembre de 2026 y cierra el 2 de octubre de 2026. El registro se realiza a través de la plataforma de Rootgraph."},
{q:"¿Cuáles son los criterios de selección?",a:"Validación comercial (producto activo con tracción real), pertenencia a verticales clave (AI, Fintech, Agtech, Logistics, Hardware y Healthtech), sinergia estratégica con el ecosistema chino, y adaptación cultural (dominio fluido del inglés y capacidad de operar en dinámicas de negociación asiáticas)."},
{q:"¿Cuál es el proceso de selección?",a:"Registro en plataforma, entrevistas con el equipo organizador y selección final. Se seleccionará un mínimo de 5 startups."},
{q:"¿Qué incluye la participación?",a:"La misión contempla distintos paquetes que pueden incluir vuelos domésticos dentro de China, alojamiento, traslados y agenda de eventos. La estructura final dependerá del nivel de financiamiento que la misión logre asegurar. Los detalles se comunicarán a los participantes seleccionados."},
{q:"¿Necesito hablar chino?",a:"No. El idioma de trabajo de la delegación es inglés. No se requiere conocimiento previo de mandarín."},
{q:"¿Puedo participar si mi startup no es argentina?",a:"Qilin Forge nace como una iniciativa del ecosistema argentino. Si tu empresa opera desde otro país de Latinoamérica y tiene interés en participar, contactanos para evaluar tu caso."}
]},
{label:"Para instituciones",items:[
{q:"¿Qué tipo de apoyo buscan?",a:"Respaldo formal, apertura de redes, difusión y co-branding. No buscamos apoyo presupuestario. El retorno es directo: asociación con una misión de alto perfil en China, visibilidad internacional y posicionamiento en el eje de diplomacia comercial tecnológica."},
{q:"¿Qué obtiene mi institución al sumarse?",a:"Asociación directa con una misión que tiene agenda en las ferias y empresas más relevantes de China, visibilidad ante el ecosistema emprendedor de ambos países, y participación en la construcción de un canal bilateral que hoy no existe en el ámbito tecnológico."},
{q:"¿Qilin Forge es un evento único o tiene continuidad?",a:"Tiene visión de continuidad. Uno de sus objetivos centrales es establecer un canal bilateral permanente post-misión, con seguimiento de acuerdos y soft-landing para las startups que avanzan. Esta primera edición es el punto de partida."}
]},
{label:"Para sponsors",items:[
{q:"¿Por qué patrocinar Qilin Forge?",a:"Porque es una oportunidad de asociar tu marca a una misión que posiciona a Argentina como origen de innovación ante el mercado más grande del mundo. Los sponsors obtienen visibilidad ante una audiencia curada de founders, inversores e instituciones de ambos países, en un contexto de alto impacto y baja saturación. Los tiers de sponsorship y sus beneficios se comunicarán próximamente."}
]}
]},

en:{
nav:{mission:"Mission",delegation:"Delegation",orgs:"Team",faq:"FAQ",apply:"Apply"},
hero:{headline:"Where Argentine talent is forged with the world's largest market.",sub:"We are forging a high-bandwidth connection between Latin America's most dynamic talent pool and Asia's most advanced technological infrastructure.",cities:"Beijing · Shanghai · Shenzhen",date:"November 2026",cta1:"Apply as a startup",cta2:"Join as an organization"},
concept:{label:"What is Qilin Forge",pull:"True alliances are melted, structured, and forged from living, intentional energy.",p1:"In Chinese mythology, the Qilin is not a symbol of random luck; it's a creature that appears before the arrival of wise minds who will alter the course of history. That premise is where our identity comes from. We added Forge because we understand that the highest-impact opportunities are shaped through long-term vision, trust, and real presence.",p2:"That's why we're crossing the map with innovative entrepreneurs who work with passion to deliver powerful solutions to meaningful problems.",p3:"China is the operating system of global commerce. Qilin Forge sets out to act as the bridge for Argentine talent to integrate directly with China's innovation ecosystem. The goal is to build real bilaterality — a deep connection where both worlds' visions intersect to enrich each other."},
tesis:{title:"The thesis",p1:"Argentina has 12 unicorns, over 1,000 active startups, and USD 400M in venture capital in Q1 2026 alone. Our tech ecosystem is one of the most mature in Latin America.",closing:"The talent is here. The traction is here. What's missing is greater distribution.",p2:"Argentina and China's relationship has historically concentrated on agro-industrial commodities. In technology, there's a major opportunity to build something new — because no structured channel exists yet to make it happen.",sub:"Qilin Forge exists to be that channel."},
opp:{title:"November 2026 opens a key window",p0:"China accounts for 18% of global GDP. It leads in foreign direct investment and operates at the frontier of AI, blockchain, robotics, biotech, and beyond. It's also the most aggressive technology-adoption market on the planet.",p:"The convergence of APEC, CIE, and the China Hi-Tech Fair concentrates the highest density of players, capital, and decisions in the Chinese tech ecosystem within a few weeks.",closing:"Combine Argentine innovative talent with the scale, manufacturing capacity, and capital of the Chinese market."},
mission:{title:"15 to 23 days. Three cities. One mission.",intro:"In November 2026, we're crossing the map with innovative entrepreneurs who work with passion to deliver powerful solutions to meaningful problems. A curated delegation of Argentine startups and tech companies travels to China, combining cultural formation, exposure at international trade fairs, and direct meetings with the players defining the future of global technology.",closing:"This is not an exploration trip. It's the beginning of bilateral tech collaboration.",cities:[{name:"Beijing",zh:"北京",desc:"Cultural formation and institutional context"},{name:"Shanghai",zh:"上海",desc:"Business meetings and strategic networking"},{name:"Shenzhen",zh:"深圳",desc:"Tech fair exposure and manufacturing connections"}]},
del:{title:"The delegation",intro:"The delegation's composition will be defined through a strict curation process, designed to guarantee the mission's credibility and maximize its odds of results.",criteria:[{t:"Commercial validation",d:"Active product in the market. We're looking for real traction, not ideas still in development."},{t:"Key verticals",d:"AI, Fintech, Agtech, Logistics, Hardware, and Healthtech. Sectors with high demand and scalability potential in the Chinese market."},{t:"Strategic synergy",d:"Provable alignment with Chinese infrastructure and distribution channels."},{t:"Cultural readiness",d:"Fluent English and the ability to adapt to Asian negotiation dynamics."}],process:"Platform registration → Technical interviews → Final selection",min:"Minimum 5 startups selected"},
orgs:{title:"Who drives this",intro:"Three organizations back this mission, each from their own place:",items:[{name:"Buidlers",role:"Convenes, curates, and legitimizes the talent that travels.",desc:"Over five years of native track record in the tech ecosystem, building infrastructure and community from within. Its history includes collaborations with Ethereum Foundation, Consensys, Aptos, and Scroll, a Solidity education program with the City of Buenos Aires government, and organizing the official DevConnect Buenos Aires 2025 hackathon."},{name:"Rootgraph",role:"Operational HQ and institutional coordination.",desc:"Focused on generating business opportunities between startups, investment funds, and accelerators."},{name:"Human Friendly",role:"Strategic direction, communications, and experience design.",desc:"A creative and technology agency. Brings the strategic direction, communications, and experience design for the entire mission."}]},
inst:{title:"Argentine diplomatic backing in China",intro:"The delegation counts on Argentine diplomatic support in China.",points:["Institutional endorsement that legitimizes the mission before key players in both ecosystems","Facilitated introductions to get the delegation a seat at the right table","Support designing the agenda to maximize the diplomatic and commercial impact of every meeting"]},
beyond:{pre:"We're not organizing an event.",hl:"We're building a bridge.",sub:"Qilin Forge doesn't end when the plane lands in Buenos Aires. Agreement follow-up, continuous soft-landing for startups that advance, and building a relationship infrastructure between both ecosystems that outlasts this first mission."},
join:{title:"Be part of it",p:"Qilin Forge is a concrete channel of tech commercial diplomacy. It positions Argentina as a source of innovation, generates real bilateral activity, and builds a relationship between both countries' entrepreneurial ecosystems.",closing:"We're not looking for spectators. We're looking for partners who want to build this bridge with us."},
cta:{s:{title:"Startups",body:"If you're a startup with traction and global vision, this is your access route to the world's largest market.",btn:"Apply now",dates:"Applications: Sept 2 - Oct 2, 2026"},i:{title:"Institutions",body:"If you're an institution that understands Argentina's tech competitiveness is defined by its ability to connect with frontier markets, your backing empowers this mission.",btn:"Join as institution"},sp:{title:"Sponsors",body:"If you're a company or brand looking to associate with a high-impact initiative with real international visibility, there's a seat at the table.",btn:"Explore sponsorship"}},
faq:{title:"FAQ",groups:[
{label:"General",items:[
{q:"What is Qilin Forge?",a:"A tech innovation and commercial diplomacy mission that takes a curated delegation of Argentine startups and tech companies to China in November 2026. The mission crosses Beijing, Shanghai, and Shenzhen, combining cultural formation, exposure at international trade fairs, and direct meetings with strategic players in China's tech ecosystem."},
{q:"When is the trip?",a:"November 2026, lasting between 15 and 23 days."},
{q:"Who organizes Qilin Forge?",a:"Three organizations: Buidlers (talent recruitment and curation), Rootgraph (operational HQ and institutional coordination), and Human Friendly (strategic direction and communications)."}
]},
{label:"For startups and companies",items:[
{q:"How can I apply to join the delegation?",a:"Applications open September 2, 2026 and close October 2, 2026. Registration happens through the Rootgraph platform."},
{q:"What are the selection criteria?",a:"Commercial validation (active product with real traction), belonging to key verticals (AI, Fintech, Agtech, Logistics, Hardware, and Healthtech), strategic synergy with the Chinese ecosystem, and cultural readiness (fluent English and the ability to operate in Asian negotiation dynamics)."},
{q:"What's the selection process?",a:"Platform registration, interviews with the organizing team, and final selection. A minimum of 5 startups will be selected."},
{q:"What does participation include?",a:"The mission includes different packages that may cover domestic flights within China, lodging, transfers, and the events agenda. The final structure will depend on the funding level the mission secures. Details will be communicated to selected participants."},
{q:"Do I need to speak Chinese?",a:"No. The delegation's working language is English. No prior Mandarin knowledge is required."},
{q:"Can I participate if my startup isn't Argentine?",a:"Qilin Forge was born as an initiative of the Argentine ecosystem. If your company operates from another Latin American country and is interested in participating, reach out and we'll evaluate your case."}
]},
{label:"For institutions",items:[
{q:"What kind of support are you looking for?",a:"Formal backing, network access, promotion, and co-branding. We're not seeking budget support. The return is direct: association with a high-profile mission in China, international visibility, and positioning at the center of tech commercial diplomacy."},
{q:"What does my institution get by joining?",a:"Direct association with a mission that has an agenda at China's most relevant fairs and companies, visibility before both countries' entrepreneurial ecosystems, and participation in building a bilateral channel that doesn't currently exist in tech."},
{q:"Is Qilin Forge a one-time event or does it have continuity?",a:"It has a vision of continuity. One of its core goals is establishing a permanent bilateral channel post-mission, with agreement follow-up and soft-landing for advancing startups. This first edition is the starting point."}
]},
{label:"For sponsors",items:[
{q:"Why sponsor Qilin Forge?",a:"Because it's an opportunity to associate your brand with a mission that positions Argentina as a source of innovation before the world's largest market. Sponsors get visibility before a curated audience of founders, investors, and institutions from both countries, in a high-impact, low-saturation context. Sponsorship tiers and benefits will be announced soon."}
]}
]},

zh:{
nav:{mission:"使命",delegation:"代表团",orgs:"组织方",faq:"常见问题",apply:"申请"},
hero:{headline:"阿根廷人才与全球最大市场的锻造之地。",sub:"我们正在拉丁美洲最具活力的人才库与亚洲最先进的技术基础设施之间，建立高带宽连接。",cities:"北京 · 上海 · 深圳",date:"2026年11月",cta1:"以初创企业身份申请",cta2:"加入组织合作"},
concept:{label:"什么是Qilin Forge",pull:"真正的联盟并非偶然，而是在鲜活而有意的能量中熔炼、构建与锻造而成。",p1:"在中国神话中，麒麟并非随机的幸运象征，而是在能够改变历史进程的智者到来之前显现的神兽。我们的品牌理念正源于此。我们加入了Forge（锻造）一词，因为我们深知，最具影响力的机遇需要以长远眼光、信任与真实的在场来塑造。",p2:"正因如此，我们将与怀抱热情、致力于为重大问题提供有力解决方案的创新企业家们一同穿越地图。",p3:"中国是全球商业的操作系统。Qilin Forge致力于成为阿根廷人才直接融入中国创新生态的桥梁，目标是建立真正的双边关系——一种让两个世界的愿景相互交汇、彼此丰富的深度连接。"},
tesis:{title:"我们的论点",p1:"阿根廷拥有12家独角兽企业，1000多家活跃的初创公司，仅2026年第一季度就吸引了4亿美元的风险投资。我们的科技生态系统是拉美最成熟的之一。",closing:"人才已就位，动力已就位。缺少的是更大程度的分销渠道。",p2:"阿根廷与中国的关系历来集中在农业大宗商品领域。在科技领域，存在巨大的创新机会——因为目前尚不存在一个结构化的渠道来实现这一点。",sub:"Qilin Forge应运而生，正是为了成为这样一个渠道。"},
opp:{title:"2026年11月，开启关键窗口期",p0:"中国占全球GDP的18%，是外国直接投资的领导者，在人工智能、区块链、机器人技术、生物科技等领域处于前沿，也是全球科技采用最积极的市场。",p:"APEC峰会、CIE博览会与中国高新技术成果交易会的交汇，在短短几周内汇聚了中国科技生态中密度最高的参与者、资本与决策。",closing:"将阿根廷的创新人才与中国市场的规模、制造能力和资本相结合。"},
mission:{title:"15至23天。三座城市。一个使命。",intro:"2026年11月，我们将与怀抱热情的创新企业家一同穿越地图，为重大问题提供有力的解决方案。一支经过精心遴选的阿根廷初创企业和科技公司代表团将前往中国，融合文化培训、国际展会曝光，以及与定义全球科技未来的关键参与者的直接会晤。",closing:"这不是一次探索之旅，而是双边科技合作的开端。",cities:[{name:"Beijing",zh:"北京",desc:"文化培训与制度背景"},{name:"Shanghai",zh:"上海",desc:"商务会议与战略交流"},{name:"Shenzhen",zh:"深圳",desc:"科技展览与制造业对接"}]},
del:{title:"代表团",intro:"代表团的组成将通过严格的遴选流程确定，旨在保证使命的公信力，并最大化取得成果的可能性。",criteria:[{t:"商业验证",d:"产品已在市场中运营。我们寻找具有真实市场牵引力的项目，而非仍处于开发阶段的想法。"},{t:"关键领域",d:"人工智能、金融科技、农业科技、物流、硬件与健康科技——在中国市场需求旺盛、扩展潜力巨大的领域。"},{t:"战略协同",d:"与中国基础设施和分销渠道具有可验证的协同性。"},{t:"文化适应力",d:"流利的英语能力，以及适应亚洲商业谈判方式的能力。"}],process:"平台注册 → 技术面试 → 最终遴选",min:"至少遴选5家初创企业"},
orgs:{title:"推动者",intro:"三家机构从各自的角度支持这一使命：",items:[{name:"Buidlers",role:"召集、遴选并为出行人才提供公信背书。",desc:"在科技生态系统中拥有五年以上的深耕经历，从内部构建基础设施与社群。合作历史包括以太坊基金会、Consensys、Aptos和Scroll，与布宜诺斯艾利斯市政府合作的Solidity教育项目，以及组织2025年DevConnect布宜诺斯艾利斯官方黑客松。"},{name:"Rootgraph",role:"运营总部与机构协调。",desc:"致力于在初创企业、投资基金和加速器之间创造商业机会。"},{name:"Human Friendly",role:"战略方向、传播与体验设计。",desc:"一家创意科技机构，负责整个使命的战略方向、传播与体验设计。"}]},
inst:{title:"阿根廷驻华外交支持",intro:"代表团获得阿根廷驻华外交力量的支持。",points:["为使命在两国生态系统的关键参与者面前提供机构背书","促成引荐，帮助代表团获得与正确对象对话的席位","协助设计议程，以最大化每场会晤的外交与商业影响力"]},
beyond:{pre:"我们不是在组织一场活动。",hl:"我们在建造一座桥梁。",sub:"当飞机降落在布宜诺斯艾利斯时，Qilin Forge并未结束。协议跟进、为持续推进的初创企业提供软着陆支持，并构建一个超越此次首航使命的双边关系基础设施。"},
join:{title:"加入我们",p:"Qilin Forge是一条具体的科技商业外交渠道。它将阿根廷定位为创新的源头，创造真实的双边活动，并在两国创业生态系统之间建立联系。",closing:"我们寻找的不是旁观者，而是愿意与我们共建这座桥梁的伙伴。"},
cta:{s:{title:"初创企业",body:"如果你的初创企业已具备市场牵引力和全球视野，这将是你进入世界最大市场的通道。",btn:"立即申请",dates:"申请期：2026年9月2日至10月2日"},i:{title:"机构",body:"如果贵机构深知阿根廷科技竞争力取决于其与前沿市场对接的能力，你的支持将为这一使命赋能。",btn:"加入机构合作"},sp:{title:"赞助商",body:"如果贵公司或品牌希望与一项具有真实国际影响力的高价值举措建立联系，这里有你的席位。",btn:"了解赞助方案"}},
faq:{title:"常见问题",groups:[
{label:"综合",items:[
{q:"什么是Qilin Forge？",a:"这是一项科技创新与商业外交使命，将于2026年11月带领经过遴选的阿根廷初创企业和科技公司代表团前往中国。使命途经北京、上海和深圳，融合文化培训、国际展会曝光，以及与中国科技生态战略参与者的直接会晤。"},
{q:"行程是什么时候？",a:"2026年11月，为期15至23天。"},
{q:"由谁组织Qilin Forge？",a:"三家机构共同组织：Buidlers（科技人才召集与遴选）、Rootgraph（运营总部与机构协调）以及Human Friendly（战略方向与传播）。"}

{q:"遴选标准是什么？",a:"商业验证（具有真实市场牵引力的活跃产品）、属于关键领域（人工智能、金融科技、农业科技、物流、硬件与健康科技）、与中国生态系统的战略协同，以及文化适应力（流利英语与亚洲商业谈判能力）。"},
{q:"遴选流程是怎样的？",a:"平台注册、与组织团队面试、最终遴选。至少将遴选5家初创企业。"},
{q:"参与内容包括什么？",a:"使命包含不同的套餐，可能涵盖中国境内的国内航班、住宿、接送以及活动议程。最终结构将取决于使命所获得的资金水平，详情将及时告知入选参与者。"},
{q:"我需要会说中文吗？",a:"不需要。代表团的工作语言是英语，无需具备普通话基础。"},
{q:"如果我的初创企业不是阿根廷企业，可以参与吗？",a:"Qilin Forge诞生于阿根廷生态系统的倡议。如果贵公司在拉丁美洲其他国家运营并有意参与，请联系我们评估你的情况。"}

{q:"Qilin Forge是一次性活动，还是具有持续性？",a:"它具有持续发展的愿景。其核心目标之一是在使命结束后建立永久性的双边渠道，持续跟进协议并为不断推进的初创企业提供软着陆支持。首届使命只是起点。"}
